# DVAIA: Docker setup — optional Ollama + Qdrant + Flask app
#
# All LLM calls route through LiteLLM, so any provider works — just set its API
# key in .env (OPENAI_API_KEY, GEMINI_API_KEY, ANTHROPIC_API_KEY, etc.) and
# point DEFAULT_MODEL at a 'provider/model' id.
#
# Run helpers:
#   ./run_docker.sh                Interactive (recommended)
#   ./run_docker.sh --local        Local Ollama + model downloads (~9–10 GB)
#   ./run_docker.sh --no-ollama    Cloud only — skip Ollama service / downloads
#
# Direct compose:
#   docker compose --profile ollama up --build   # local Ollama
#   docker compose up --build                    # cloud only (no Ollama service)
services:
  ollama:
    profiles:
      - ollama
    networks:
      - dvaia
    image: ollama/ollama:latest
    container_name: dvaia-ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11480:11434"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull llama3.2
        ollama pull nomic-embed-text
        ollama pull qwen3:0.6b
        ollama pull qwen2.5vl:7b
        wait

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dvaia-qdrant
    networks:
      - dvaia
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: "no"

  dvaia:
    build: .
    container_name: dvaia-app
    networks:
      - dvaia
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PORT=${PORT:-5000}
      - RESET_DATA_ON_START=${RESET_DATA_ON_START:-false}
      # Overrides .env localhost — app container must reach the ollama service by name.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      # Server-mode Qdrant inside Docker (overrides QDRANT_MODE=local in .env).
      - QDRANT_MODE=server
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DEFAULT_MODEL=${DEFAULT_MODEL:-ollama/llama3.2}
      - VISION_MODEL=${VISION_MODEL:-ollama/qwen2.5vl:7b}
      - AGENTIC_MODEL=${AGENTIC_MODEL:-ollama/qwen3:0.6b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-ollama/nomic-embed-text}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - DATABASE_URI=${DATABASE_URI:-data/app.db}
      - UPLOAD_DIR=${UPLOAD_DIR:-data/uploads}
      - PAYLOADS_OUTPUT_DIR=${PAYLOADS_OUTPUT_DIR:-data/payloads/generate}
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

networks:
  dvaia:
    driver: bridge

volumes:
  ollama_data:
  qdrant_data:
